<!-- Simple WhatsApp-style icon SVG -->
<!-- Save this as .svg, then convert to PNG at different sizes -->

<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#25D366"/>

  <!-- Chat bubble -->
  <rect x="30" y="35" width="68" height="45" rx="8" fill="white"/>

  <!-- Message lines -->
  <rect x="38" y="45" width="30" height="3" rx="1.5" fill="#25D366"/>
  <rect x="38" y="52" width="40" height="3" rx="1.5" fill="#25D366"/>
  <rect x="38" y="59" width="25" height="3" rx="1.5" fill="#25D366"/>

  <!-- AI robot symbol -->
  <circle cx="85" cy="90" r="15" fill="white"/>
  <circle cx="82" cy="87" r="2" fill="#25D366"/>
  <circle cx="88" cy="87" r="2" fill="#25D366"/>
  <rect x="83" y="92" width="4" height="2" rx="1" fill="#25D366"/>

  <!-- Small connecting line -->
  <path d="M70 75 Q77 82 85 75" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>