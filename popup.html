<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp AI Bot</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WhatsApp AI Bot</h1>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Offline</span>
            </div>
        </div>

        <div class="main">
            <div class="toggle-section">
                <label class="toggle-container">
                    <input type="checkbox" id="botToggle">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">Enable AI Bot</span>
                </label>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Messages Processed:</span>
                    <span class="stat-value" id="messageCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Responses Sent:</span>
                    <span class="stat-value" id="responseCount">0</span>
                </div>
            </div>

            <div class="activity-log">
                <h3>Recent Activity</h3>
                <div class="log-container" id="logContainer">
                    <div class="log-item">Bot initialized</div>
                </div>
            </div>

            <div class="actions">
                <button id="optionsBtn" class="btn btn-secondary">Settings</button>
                <button id="clearLogBtn" class="btn btn-outline">Clear Log</button>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
